transformation:
  - isDynamic: true
    alias: TransformationJoin
    description: transform to join
    sequence: 6
    inputDataFrameList:
      - inputDataFrame: Sensor_Data_1
        tempViewName: sensor_data
      - inputDataFrame: Operational_Data_1
        tempViewName: operational_data
      - inputDataFrame: Maintenance_Data_1
        tempViewName: maintenance_data
      - inputDataFrame: Environmental_Data_1
        tempViewName: environmental_data
      - inputDataFrame: Production_Data_1
        tempViewName: production_data
    query: " SELECT      full_data.*,      pd.production_volume,
      pd.production_speed, pd.defect_rate
      FROM      (SELECT          integrated_data.*,          md.maintenance_dat\
      e, md.maintenance_type,
      md.components_replaced      FROM          (SELECT              combined_d\
      ata.*,              ed.temperature AS environmental_temperature,
      ed.humidity,
      ed.dust_level          FROM              (SELECT                  cast(sd\
      .timestamp as timestamp) sensor_timestamp, sd.machine_id, sd.vibration,
      sd.temperature AS sensor_temperature, sd.pressure,
      sd.acoustic,                 od.utilization, od.operational_hours,
      od.load              FROM                  sensor_data
      sd              JOIN                  operational_data od ON sd.timestamp
      = od.timestamp AND sd.machine_id = od.machine_id)
      combined_data          LEFT JOIN              environmental_data ed ON
      combined_data.sensor_timestamp = ed.timestamp) integrated_data      LEFT
      JOIN          maintenance_data md ON integrated_data.machine_id =
      md.machine_id AND DATE(integrated_data.sensor_timestamp) =
      md.maintenance_date) full_data JOIN      production_data pd ON
      full_data.sensor_timestamp = pd.timestamp AND full_data.machine_id =
      pd.machine_id;"
    optional:
      persistDataFrame: false
      loggingOptions:
        printSchema: true
    type: operationThroughSqlQuery
